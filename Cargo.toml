[package]
name = "le-harness"
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.88"
description = "Transparent coding-agent runtime for the Mistral ecosystem"
license = "MIT"
repository = "https://github.com/artemidius/Le-Harness"
readme = "README.md"
keywords = ["mistral", "codestral", "agent", "cli", "rust"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[package.metadata.deb]
maintainer = "Artem Sborets <9936670+artemidius@users.noreply.github.com>"
copyright = "2026, Artem Sborets"
license-file = ["LICENSE", "0"]
extended-description-file = "packaging/debian/description.txt"
changelog = "packaging/debian/changelog"
depends = "$auto, ca-certificates, git"
suggests = "docker.io"
section = "devel"
priority = "optional"
assets = [
    ["target/release/le-harness", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/le-harness/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/le-harness/changelog", "644"],
    ["docs/configuration.md", "usr/share/doc/le-harness/configuration.md", "644"],
    ["packaging/le-harness.1", "usr/share/man/man1/le-harness.1", "644"],
]

[profile.release]
strip = "symbols"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
ignore = "0.4"
le-rust = { git = "https://github.com/artemidius/Le-Rust", tag = "v0.1.1" }
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-child-process"] }
ratatui = "0.29"
rpassword = "=7.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

