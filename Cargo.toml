[package]
name = "le-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "A transparent coding-agent runtime for the Mistral ecosystem"
license = "MIT"
repository = "https://github.com/artemidius/Le-Harness"
readme = "README.md"
keywords = ["mistral", "codestral", "agent", "cli", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
ignore = "0.4"
le-rust = { git = "https://github.com/artemidius/Le-Rust", tag = "v0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

