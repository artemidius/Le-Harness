[package]
name = "le-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "A transparent coding-agent runtime for the Mistral ecosystem"
license = "MIT"
repository = "https://github.com/artemidius/Le-Harness"
readme = "README.md"
keywords = ["mistral", "codestral", "agent", "cli", "rust"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

