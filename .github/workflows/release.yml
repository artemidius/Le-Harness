name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and stage
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.88.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      notes_file: ${{ steps.metadata.outputs.notes_file }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: metadata
        name: Validate tag, package metadata, and release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release/validate_release.py \
            --tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            debian_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            debian_arch: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:12-slim
    steps:
      - name: Install pinned build environment
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl dpkg-dev file git lintian pkg-config python3
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Debian packager
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke test and inspect runtime dependencies
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/le-harness"
          test "$("$binary" --version)" = "le-harness ${{ needs.validate.outputs.version }}"
          "$binary" --no-input doctor > runtime-doctor.txt
          ldd "$binary" > "runtime-${{ matrix.target }}-ldd.txt"
          file "$binary" > "runtime-${{ matrix.target }}-file.txt"
      - name: Create versioned archive
        shell: bash
        run: |
          mkdir -p package out
          cp "target/${{ matrix.target }}/release/le-harness" LICENSE README.md package/
          archive="le-harness-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.tar.gz"
          tar -C package -czf "out/$archive" .
          mv runtime-*.txt out/
      - name: Build and inspect Debian packages
        shell: bash
        run: |
          main_version="$(python3 -c 'from scripts.release.assemble_manifest import debian_version; print(debian_version("${{ needs.validate.outputs.version }}"))')"
          main_deb="out/$(python3 -c 'from scripts.release.assemble_manifest import debian_asset_name; print(debian_asset_name("${{ needs.validate.outputs.version }}", "${{ matrix.debian_arch }}"))')"
          fixture_deb="out/upgrade-fixture-${{ matrix.debian_arch }}.deb"
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" \
            --deb-revision 1 --output "$main_deb"
          cargo deb --no-build --no-strip --target "${{ matrix.target }}" \
            --deb-revision 0 --output "$fixture_deb"
          test "$(dpkg-deb -f "$main_deb" Architecture)" = "${{ matrix.debian_arch }}"

          dependencies="$(dpkg-deb -f "$main_deb" Depends)"
          grep -Fq ca-certificates <<< "$dependencies"
          grep -Fq git <<< "$dependencies"
          test "$(dpkg-deb -f "$main_deb" Suggests)" = docker.io
          dpkg --compare-versions "$(dpkg-deb -f "$fixture_deb" Version)" lt "$main_version"
          dpkg --compare-versions 0.1.0~rc.2-1 lt 0.1.0~rc.3-1
          dpkg --compare-versions 0.1.0~rc.3-1 lt 0.1.0~rc.10-1
          dpkg --compare-versions 0.1.0~rc.10-1 lt 0.1.0-1
          dpkg --compare-versions 0.1.0-1 lt 0.1.0-2

          rm -rf package-root package-control
          mkdir package-root package-control
          dpkg-deb --extract "$main_deb" package-root
          dpkg-deb --control "$main_deb" package-control
          cmp "target/${{ matrix.target }}/release/le-harness" package-root/usr/bin/le-harness
          test "$(stat -c '%a' package-root/usr/bin/le-harness)" = 755
          test -f package-root/usr/share/doc/le-harness/copyright
          if find package-control -maxdepth 1 -type f \
            \( -name preinst -o -name postinst -o -name prerm -o -name postrm \) \
            | grep -q .; then
            echo "unexpected Debian maintainer script" >&2
            exit 1
          fi

          dpkg-deb --info "$main_deb" > "out/package-${{ matrix.target }}-info.txt"
          dpkg-deb --contents "$main_deb" > "out/package-${{ matrix.target }}-contents.txt"
          lintian --fail-on error "$main_deb" > "out/package-${{ matrix.target }}-lintian.txt" 2>&1
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  build-portable:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test and package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/le-harness"
          test "$("$binary" --version)" = "le-harness ${{ needs.validate.outputs.version }}"
          "$binary" --no-input doctor > runtime-doctor.txt
          mkdir -p package out
          cp "$binary" LICENSE README.md package/
          archive="le-harness-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.tar.gz"
          tar -C package -czf "out/$archive" .
      - name: Smoke test and package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/le-harness.exe"
          $actualVersion = & $binary --version
          if ($actualVersion -ne "le-harness ${{ needs.validate.outputs.version }}") {
            throw "unexpected binary version: $actualVersion"
          }
          & $binary --no-input doctor | Out-File -Encoding utf8 runtime-doctor.txt
          New-Item -ItemType Directory -Force package, out | Out-Null
          Copy-Item $binary, LICENSE, README.md package/
          $archive = "le-harness-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.zip"
          Compress-Archive -Path package/* -DestinationPath "out/$archive"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  test-deb:
    needs: [validate, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: amd64
            image: debian:12-slim
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: amd64
            image: debian:13-slim
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: amd64
            image: ubuntu:24.04
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            architecture: amd64
            image: ubuntu:26.04
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            image: debian:12-slim
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            image: debian:13-slim
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            image: ubuntu:24.04
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            image: ubuntu:26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: packages
      - name: Test install, upgrade, removal, and purge
        shell: bash
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/packages,dst=/packages,readonly" \
            "${{ matrix.image }}" \
            bash /workspace/scripts/release/test_deb_install.sh \
              /packages "${{ needs.validate.outputs.version }}" "${{ matrix.architecture }}"

  manifest:
    needs: [validate, build-linux, build-portable, test-deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Assemble and verify release inventory
        run: |
          python3 scripts/release/assemble_manifest.py \
            --directory release \
            --tag "${{ needs.validate.outputs.tag }}" \
            --commit "${{ needs.validate.outputs.commit }}"
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: |
            release/le-harness-*.tar.gz
            release/le-harness-*.zip
            release/le-harness_*.deb
            release/release-manifest.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    needs: [validate, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release
      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TITLE: Le Harness ${{ needs.validate.outputs.tag }}
          NOTES_FILE: ${{ needs.validate.outputs.notes_file }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE")
            if [[ "$PRERELEASE" == "true" ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi

          mapfile -t assets < <(
            jq -r '.artifacts[].name' release/release-manifest.json
            printf '%s\n' release-manifest.json SHA256SUMS
          )
          existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            if grep -Fxq "$asset" <<< "$existing"; then
              directory="$(mktemp -d)"
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$directory"
              cmp "release/$asset" "$directory/$asset"
              rm -rf "$directory"
            else
              gh release upload "$RELEASE_TAG" "release/$asset"
            fi
          done
