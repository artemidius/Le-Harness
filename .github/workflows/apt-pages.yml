name: Publish APT repository

on:
  release:
    types: [published]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag; blank selects the latest release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: apt-signing
    outputs:
      tags: ${{ steps.snapshot.outputs.tags }}
      suites: ${{ steps.snapshot.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils dpkg-dev gnupg
      - id: releases
        name: Select complete published releases
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          required_tag="${EVENT_TAG:-${REQUESTED_TAG:-}}"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          arguments=(--input releases.json --output selected-tags.txt --retention 3)
          if test -n "$required_tag"; then
            arguments+=(--required-tag "$required_tag")
          fi
          python3 scripts/apt/select_releases.py "${arguments[@]}"
      - name: Download immutable release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r tag; do
            mkdir -p "downloaded/$tag"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern release-manifest.json \
              --pattern 'le-harness_*.deb' \
              --dir "downloaded/$tag"
          done < selected-tags.txt
      - id: snapshot
        name: Validate retained release manifests and package bytes
        run: |
          arguments=(--output prepared --retention 3 --github-output "$GITHUB_OUTPUT")
          while IFS= read -r tag; do
            arguments+=(--directory "downloaded/$tag")
          done < selected-tags.txt
          python3 scripts/apt/prepare_snapshot.py "${arguments[@]}"
      - name: Import protected signing subkey
        env:
          APT_SIGNING_SUBKEY: ${{ secrets.APT_SIGNING_SUBKEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_SUBKEY" | gpg --batch --import
          printf '%s' "$APT_SIGNING_PASSPHRASE" > "$RUNNER_TEMP/apt-passphrase"
          chmod 0600 "$RUNNER_TEMP/apt-passphrase"
          fingerprint="$(cat packaging/apt/SIGNING-KEY-FINGERPRINT)"
          gpg --batch --list-secret-keys "$fingerprint"
      - name: Build signed repository site
        env:
          GNUPGHOME: ${{ runner.temp }}/apt-gnupg
        run: |
          fingerprint="$(cat packaging/apt/SIGNING-KEY-FINGERPRINT)"
          mkdir site
          suites=()
          while IFS= read -r suite; do
            suites+=(--suite "$suite=prepared/$suite")
          done < <(find prepared -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          SOURCE_DATE_EPOCH="$(date +%s)" python3 scripts/apt/build_repository.py \
            --output site/apt \
            "${suites[@]}" \
            --architectures amd64,arm64 \
            --signing-key "$fingerprint" \
            --passphrase-file "$RUNNER_TEMP/apt-passphrase" \
            --valid-days 30 \
            --max-bytes 200000000
          test "$(cat site/apt/SIGNING-KEY-FINGERPRINT)" = "$fingerprint"
          while IFS= read -r suite; do
            gpg --batch --verify "site/apt/dists/$suite/InRelease"
          done < <(find site/apt/dists -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          cp docs/install/apt.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
